<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 养蛊机 · 双跑对照（日新赛道）</title>
<!--
  赛道要求 → 页面版块的一一对应（选手手册 · 日新主题赛道）
    ①「比的是什么指标，两次各是多少」  → .hero  大字：正确率 pass1 → pass2，delta
    ②「学到了什么」                    → .learn 规则 diff / 新增记忆 / 变了的状态参数
    ③「怎么退回第一次之前的版本」       → .roll  快照 ID + 一键回退 + 校验哈希
    ④「两次之间不许改代码/参数/提示词」  → .frozen 两次运行的 config/prompts SHA-256 一致徽章

  硬约束：零依赖、零 CDN、断网可播、页面内不写任何数字常量（全部读 evolve.json）
-->
<style>
  :root{
    --bg:#0b0d10; --surface:#12151a; --surface-2:#171b21;
    --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.16);
    --text:#e8eaed; --muted:#8b939e; --faint:#5d646e;
    --accent:#ffd166;
    --good:#45d19a; --bad:#ff6b6b; --neutral:#5aa9ff;
    --font-display:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Microsoft YaHei UI",sans-serif;
    --font-mono:"Cascadia Mono","Consolas","IBM Plex Mono",monospace;
    --font-body:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  body{padding:18px 24px 22px;height:100vh;display:flex;flex-direction:column;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),
      radial-gradient(900px 320px at 16% -8%,rgba(90,169,255,.10),transparent 70%);
    background-size:64px 64px,64px 64px,auto;}

  /* ── 页眉 ─────────────────────────────── */
  header{display:flex;align-items:center;gap:16px;padding-bottom:12px;
    border-bottom:1px solid var(--line);margin-bottom:14px}
  h1{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;
    letter-spacing:.02em;white-space:nowrap}
  h1 span{color:var(--accent)}
  .frozen{display:flex;gap:7px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .badge{font-family:var(--font-mono);font-size:10.5px;padding:3px 9px;border-radius:3px;
    border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
  .badge.ok{color:var(--good);border-color:rgba(69,209,154,.42);background:rgba(69,209,154,.07)}
  .badge.bad{color:var(--bad);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.09)}
  .badge.wait{color:var(--accent);border-color:rgba(255,209,102,.38);background:rgba(255,209,102,.06)}
  .badge b{color:var(--text);font-weight:500}
  .nav{display:flex;gap:6px;align-self:center;margin-left:14px}
  .nav a{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:3px;padding:4px 9px;background:var(--surface);
    letter-spacing:.04em;white-space:nowrap;transition:color .15s ease,border-color .15s ease}
  .nav a:hover{color:var(--accent);border-color:rgba(255,209,102,.45)}

  /* ── 指标主区 ───────────────────────────── */
  .hero{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:12px;margin-bottom:14px;
    animation:rise .5s var(--ease) both;flex:0 0 auto}
  .cell{background:var(--surface);border:1px solid var(--line);border-radius:5px;
    padding:12px 15px;position:relative;overflow:hidden}
  .cell::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
  .cell .lb{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:5px}
  .cell .big{font-family:var(--font-mono);font-size:46px;line-height:1;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .cell .sub{font-size:11.5px;color:var(--faint);margin-top:6px;font-family:var(--font-mono)}
  .cell.p1 .big{color:var(--muted)}
  .cell.p2 .big{color:var(--good)}
  .cell.dt .big{color:var(--accent)}
  .cell.dt .big small{font-size:17px;font-weight:400;margin-left:2px}
  .cell.one{display:flex;flex-direction:column;justify-content:center}
  .cell.one .lb{color:var(--accent)}
  .cell.one p{margin:0;font-size:12.5px;line-height:1.55;color:#c8ced6}

  /* ── 主体两栏 ───────────────────────────── */
  .grid{display:grid;grid-template-columns:1.06fr .94fr;gap:12px;margin-bottom:12px;
    flex:1 1 auto;min-height:0}
  section{background:var(--surface);border:1px solid var(--line);border-radius:5px;
    padding:13px 15px 14px;animation:rise .5s var(--ease) both}
  section:nth-of-type(1){animation-delay:.06s}
  section:nth-of-type(2){animation-delay:.12s}
  .hd{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
  .hd h2{font-family:var(--font-display);font-size:13px;font-weight:600;margin:0;
    letter-spacing:.05em}
  .hd .hint{font-size:11px;color:var(--faint)}

  /* 逐题对照 */
  .trow{display:grid;grid-template-columns:58px 82px 1fr 1fr 66px;gap:0;align-items:center;
    height:auto;flex:1 1 0;min-height:28px;border-bottom:1px solid rgba(255,255,255,.045);font-size:13px}
  .trow.head{flex:0 0 22px;min-height:22px;height:22px;border-bottom:1px solid var(--line-strong);color:var(--faint);font-size:10.5px}
  .trow .id{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
  .trow .fam{font-size:10.5px;color:var(--faint)}
  .mark{display:inline-flex;align-items:center;justify-content:center;
    width:21px;height:21px;border-radius:3px;font-size:11px;font-family:var(--font-mono)}
  .mark.y{background:rgba(69,209,154,.16);color:var(--good);border:1px solid rgba(69,209,154,.45)}
  .mark.n{background:rgba(255,107,107,.13);color:var(--bad);border:1px solid rgba(255,107,107,.42)}
  .dlt{font-size:10.5px;font-family:var(--font-mono);text-align:right;padding-right:2px}
  .dlt.up{color:var(--good)} .dlt.dn{color:var(--bad)} .dlt.fl{color:var(--faint)}
  .note{font-size:11.5px;color:var(--faint);margin-top:9px;padding-top:2px;line-height:1.5;flex:0 0 auto}
  #tasks{flex:1;min-height:0;display:flex;flex-direction:column}
  #learn{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between}

  /* 学到什么 */
  .blk{margin-bottom:11px}
  .blk:last-child{margin-bottom:0}
  .blk .t{font-size:10.5px;color:var(--accent);letter-spacing:.09em;margin-bottom:6px;
    display:flex;gap:7px;align-items:center}
  .blk .t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,209,102,.35),transparent)}
  .rule{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px;line-height:1.5}
  .rule:last-child{border-bottom:0}
  .rule .rid{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);
    flex:0 0 auto;padding-top:1px}
  .rule .tx{color:#ccd2da}
  .rule .ev{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}
  .mem{font-size:11.5px;color:#b9c0c9;padding:3px 0 3px 0;display:flex;gap:7px}
  .mem .k{font-family:var(--font-mono);font-size:10px;color:var(--neutral);flex:0 0 auto}
  .par{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:11.5px;padding:3px 0;
    font-family:var(--font-mono)}
  .par .vb{color:var(--faint)}
  .par .va{color:var(--text)}
  .par .sc{font-size:10px;color:var(--faint);margin-left:5px;font-family:var(--font-body)}

  /* 回退条 */
  .roll{display:flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid rgba(255,209,102,.28);border-radius:5px;padding:11px 15px;
    animation:rise .5s var(--ease) .18s both}
  .roll .lb{font-size:10.5px;color:var(--accent);letter-spacing:.09em;flex:0 0 auto}
  .roll .snap{font-family:var(--font-mono);font-size:12px;color:var(--text);flex:0 0 auto}
  .roll .cmd{font-family:var(--font-mono);font-size:11px;color:var(--faint);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .roll button{font-family:var(--font-body);font-size:12px;padding:7px 16px;border-radius:4px;
    border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.1);color:var(--accent);
    cursor:pointer;white-space:nowrap;transition:background .15s}
  .roll button:hover{background:rgba(255,209,102,.2)}
  .roll button:disabled{opacity:.45;cursor:default}
  .roll .st{font-family:var(--font-mono);font-size:11px;flex:0 0 auto;min-width:0}

  body.loading main{opacity:.15}
  main{transition:opacity .3s;display:flex;flex-direction:column;flex:1;min-height:0}
  .grid section{display:flex;flex-direction:column;min-height:0}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="loading">
<main>
  <header>
    <h1>日新赛道 · <span>双跑对照</span></h1>
    <nav class="nav">
      <a href="index.html">演化大屏</a>
      <a href="result.html">结果页</a>
    </nav>
    <div class="frozen" id="frozen"></div>
  </header>

  <div class="hero" id="hero"></div>

  <div class="grid">
    <section>
      <div class="hd"><h2>逐题对照</h2><span class="hint" id="lhint"></span></div>
      <div id="tasks"></div>
      <div class="note" id="tnote"></div>
    </section>
    <section>
      <div class="hd"><h2>学到了什么</h2><span class="hint">pass1 的失败模式 → pass2 的 rule / memory</span></div>
      <div id="learn"></div>
    </section>
  </div>

  <div class="roll" id="roll"></div>
</main>

<script>
(function(){
  "use strict";
  var D = null;

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function pct(x){ return (x * 100).toFixed(1); }
  function sign(x){ return (x > 0 ? "+" : "") + x.toFixed(1); }

  function fail(msg){
    document.body.classList.remove("loading");
    el("hero").innerHTML = '<div class="cell one"><div class="lb">数据加载失败</div>' +
      '<p>' + esc(msg) + '<br>请先在项目根目录运行 <code>python tests/make_fake_evolve.py</code> 或 <code>python -m app.demo pair</code></p></div>';
  }

  function renderFrozen(){
    var f = D.frozen || {};
    var same = f.identical_across_passes === true;
    function fp(v, label){
      var missing = !v || String(v).indexOf("no-") === 0;
      return missing
        ? '<span class="badge wait" title="该文件尚未由 A/B 交付，交付后自动出现指纹">' + label + ' 待交付</span>'
        : '<span class="badge">' + label + ' <b>' + esc(v) + '</b></span>';
    }
    el("frozen").innerHTML =
      '<span class="badge ' + (same ? 'ok' : 'bad') + '">' +
        (same ? '✓ 代码 / 参数 / 提示词 两次完全一致' : '✗ 冻结校验未通过，本次结果不可用') + '</span>' +
      fp(f.config_sha256, 'config') +
      fp(f.prompts_sha256, 'prompts') +
      '<span class="badge">model <b>' + esc(D.model_id || "同一实例") + '</b></span>';
  }

  function renderHero(){
    var p1 = D.passes[0], p2 = D.passes[1], c = D.conclusion || {};
    var dpp = Number(c.delta_accuracy_pp || 0);
    var cls = dpp > 1 ? "up" : dpp < -1 ? "dn" : "fl";
    var col = dpp > 1 ? "var(--good)" : dpp < -1 ? "var(--bad)" : "var(--accent)";

    el("hero").innerHTML =
      '<div class="cell p1"><div class="lb">第一次 · PASS 1</div>' +
        '<div class="big">' + pct(p1.accuracy) + '<small style="font-size:18px">%</small></div>' +
        '<div class="sub">' + p1.correct + '/' + p1.total + ' 题 · ' + p1.duration_s.toFixed(1) + 's</div></div>' +
      '<div class="cell p2"><div class="lb">第二次 · PASS 2</div>' +
        '<div class="big">' + pct(p2.accuracy) + '<small style="font-size:18px">%</small></div>' +
        '<div class="sub">' + p2.correct + '/' + p2.total + ' 题 · ' + p2.duration_s.toFixed(1) + 's</div></div>' +
      '<div class="cell dt"><div class="lb">差 值 · DELTA</div>' +
        '<div class="big" style="color:' + col + '">' + sign(dpp) + '<small>pp</small></div>' +
        '<div class="sub">' + esc(D.metric.name) + '</div></div>' +
      '<div class="cell one"><div class="lb">一句话结论</div>' +
        '<p>' + esc(c.one_line || "") + '</p></div>';
  }

  function renderTasks(){
    var p1 = D.passes[0], p2 = D.passes[1];
    var m2 = {};
    (p2.per_task || []).forEach(function(t){ m2[t.id] = t; });
    var up = 0, dn = 0;

    var rows = ['<div class="trow head"><span>题目</span><span>族</span>' +
                '<span>pass 1</span><span>pass 2</span><span class="dlt">变化</span></div>'];
    (p1.per_task || []).forEach(function(a){
      var b = m2[a.id] || {correct:false};
      var tag, cls;
      if (!a.correct && b.correct){ tag = "错→对"; cls = "up"; up++; }
      else if (a.correct && !b.correct){ tag = "对→错"; cls = "dn"; dn++; }
      else if (a.correct && b.correct){ tag = "稳定"; cls = "fl"; }
      else { tag = "仍错"; cls = "fl"; }
      rows.push('<div class="trow">' +
        '<span class="id">' + esc(a.id) + '</span>' +
        '<span class="fam">' + esc(a.family) + '</span>' +
        '<span><i class="mark ' + (a.correct ? 'y' : 'n') + '">' + (a.correct ? '✓' : '✗') + '</i></span>' +
        '<span><i class="mark ' + (b.correct ? 'y' : 'n') + '">' + (b.correct ? '✓' : '✗') + '</i></span>' +
        '<span class="dlt ' + cls + '">' + tag + '</span>' +
      '</div>');
    });
    el("tasks").innerHTML = rows.join("");
    el("lhint").textContent = D.metric.n_tasks + " 题 · 判分由 executor 精确计算，不经 LLM 裁判";
    el("tnote").innerHTML = '净变化 <b style="color:var(--good)">+' + up + '</b> 题转对，' +
      '<b style="color:var(--bad)">-' + dn + '</b> 题转错。' +
      '规则只增补解题步骤校验，不替换题面，因此失败模式可迁移到同类新题。';
  }

  function renderLearn(){
    var L = D.learned || {}, out = [];

    var rules = L.rules_added || [];
    out.push('<div class="blk"><div class="t">新增规则 RULES · ' + rules.length + ' 条</div>');
    rules.forEach(function(r){
      out.push('<div class="rule"><span class="rid">' + esc(r.id) + '</span><span class="tx">' +
        esc(r.text) + '<span class="ev">依据：' + esc(r.evidence || "—") + '</span></span></div>');
    });
    out.push('</div>');

    var mems = L.memories_added || [];
    out.push('<div class="blk"><div class="t">新增记忆 MEMORY · ' + mems.length + ' 条</div>');
    mems.forEach(function(m){
      out.push('<div class="mem"><span class="k">' + esc(m.id) + '</span><span>' + esc(m.text) + '</span></div>');
    });
    out.push('</div>');

    var par = L.params_changed || [];
    out.push('<div class="blk"><div class="t">参数变化 PARAMS · ' + par.length + ' 项</div>');
    par.forEach(function(p){
      var same = Number(p.before) === Number(p.after);
      out.push('<div class="par"><span>' + esc(p.key) +
        '<span class="sc">' + esc(p.scope) + (same ? ' · 未变（冻结）' : ' · 自适应调整') + '</span></span>' +
        '<span><span class="vb">' + p.before + '</span> → <span class="va" style="color:' +
        (same ? 'var(--faint)' : 'var(--accent)') + '">' + p.after + '</span></span></div>');
    });
    out.push('</div>');
    el("learn").innerHTML = out.join("");
  }

  function renderRoll(){
    var r = D.rollback || {};
    el("roll").innerHTML =
      '<span class="lb">回 退</span>' +
      '<span class="snap">' + esc(r.snapshot_id) + '</span>' +
      '<span class="cmd">' + esc(r.command) + '</span>' +
      '<span class="st" id="rst"></span>' +
      '<button id="rbtn"' + (r.available ? '' : ' disabled') + '>退回到第一次之前</button>';
    el("rbtn").addEventListener("click", doRollback);
  }

  function doRollback(){
    var btn = el("rbtn"), st = el("rst");
    if (!confirm("确认回退到 pass1 之前的快照？\n\n回退后 state.json 恢复为原始版本，新增规则与记忆全部清空。")) return;
    btn.disabled = true; st.textContent = "回退中…"; st.style.color = "var(--muted)";
    fetch("api/rollback", { method: "POST" })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
      .then(function(res){
        if (!res.ok) throw new Error(res.body.error || "服务端拒绝");
        st.style.color = "var(--good)";
        st.textContent = "✓ 已回退 · " + res.body.preview;
        btn.textContent = "已回退到 " + res.body.snapshot_id;
      })
      .catch(function(e){
        st.style.color = "var(--accent)";
        st.textContent = "↳ 手动执行：" + (D.rollback.command || "");
        btn.disabled = false;
        console.warn(e);
      });
  }

  function render(){
    el("hero").innerHTML = "";
    renderFrozen(); renderHero(); renderTasks(); renderLearn(); renderRoll();
    document.body.classList.remove("loading");
  }

  fetch("evolve.json", { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){ D = j; render(); })
    .catch(function(e){ fail("evolve.json 读取失败：" + e.message); });
})();
</script>
</body>
</html>
